theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - toc.integrate
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - announce.dismiss
    - header.autohide
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.prune
    - navigation.path
    - content.footnote
    - content.tables
  icon:
    logo: material/library
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - tables
  - toc:
      permalink: true
plugins:
  - search:
      lang: en
  - mermaid2:
      arguments:
        - --theme
        - default
